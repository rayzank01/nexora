[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-telegram"
version = "1.0.0"
description = "Self-hosted Telegram moderation, community analytics, publishing and support"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.0,<13", "tzdata>=2026.1,<2027"]

[project.scripts]
nexora = "nexora.__main__:main"

[tool.setuptools.packages.find]
include = ["nexora*"]

[tool.setuptools.package-data]
nexora = ["dashboard.html", "console.html", "locales.json"]

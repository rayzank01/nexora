services:
  nexora:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_HOST: 0.0.0.0
      DATABASE_PATH: /app/data/nexora.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nexora-data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready',timeout=3)"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  nexora-data:
